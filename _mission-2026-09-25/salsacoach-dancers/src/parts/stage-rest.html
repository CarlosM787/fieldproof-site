  {{DOCK_OPEN}}<section class="dock" aria-label="Controls">
    <button type="button" id="play" class="play" aria-pressed="false"><svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg><svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg><svg class="ic-step" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14l9-7zM16 5h3v14h-3z" fill="currentColor"/></svg><span id="playLabel">Play</span></button>
    <div class="ctl tempo"><label for="tempo" data-i18n="tempo">Tempo</label><div class="row"><input type="range" id="tempo" min="60" max="220" step="2" value="150"><output id="tempoOut" for="tempo">150</output><span data-i18n="bpm">BPM</span></div><output id="tempoEff" class="eff" for="tempo slow"></output></div>
    <div class="ctl"><span class="lbl" data-i18n="speed">Speed</span><div class="checks"><label><input type="checkbox" id="slow"><span data-i18n="slow">Slow motion ½×</span></label><label><input type="checkbox" id="stepMode"><span data-i18n="stepMode">Step by step</span></label></div></div>
    <div class="ctl"><label for="pattern" data-i18n="pattern">Step pattern</label><select id="pattern"><option value="on1">On1</option><option value="on2t">On2 · Torres count · preview</option><option value="on2c">On2 · 2-3-4 count · preview</option></select></div>
    <div class="ctl"><span class="lbl" data-i18n="loop">Loop</span><div class="seg" role="group" aria-label="Loop"><button type="button" data-loop="all" aria-pressed="true">1–8</button><button type="button" data-loop="first" aria-pressed="false">1–4</button><button type="button" data-loop="second" aria-pressed="false">5–8</button></div></div>
    <div class="ctl"><span class="lbl" data-i18n="show">Show</span><div class="seg" role="group" aria-label="Show"><button type="button" data-role="both" aria-pressed="true" data-i18n="both">Both</button><button type="button" data-role="leader" aria-pressed="false" data-i18n="leader">Leader</button><button type="button" data-role="follower" aria-pressed="false" data-i18n="follower">Follower</button></div></div>
    <div class="ctl"><span class="lbl" data-i18n="view">Camera</span><div class="seg" role="group" aria-label="Camera"><button type="button" data-view="leader" aria-pressed="true" data-i18n="vLeader">Behind leader</button><button type="button" data-view="follower" aria-pressed="false" data-i18n="vFollower">Behind follower</button><button type="button" data-view="side" aria-pressed="false" data-i18n="vSide">Side</button><button type="button" data-view="top" aria-pressed="false" data-i18n="vTop">Above</button></div></div>
    <fieldset class="ctl ov"><legend class="lbl" data-i18n="overlays">Teaching overlays</legend><div class="checks"><label><input type="checkbox" id="ov-count" checked><span data-i18n="ovCount">Count numbers</span></label><label><input type="checkbox" id="ov-weight" checked><span data-i18n="ovWeight">Weight</span></label><label><input type="checkbox" id="ov-rhythm" checked><span data-i18n="ovRhythm">Quick-quick-slow</span></label><label><input type="checkbox" id="ov-prints" checked><span data-i18n="ovPrints">Footprints</span></label></div></fieldset>
    <div class="ctl checks"><label><input type="checkbox" id="voice"><span data-i18n="voice">Count voice</span></label><label><input type="checkbox" id="mirror"><span data-i18n="mirror">Mirror</span></label><label><input type="checkbox" id="reduced"><span data-i18n="reduced">Reduced motion</span></label></div>
    <div class="ctl stepper"><button type="button" id="prev"><span aria-hidden="true">◀ </span><span data-i18n="prev">Previous count</span></button><button type="button" id="next"><span data-i18n="next">Next count</span><span aria-hidden="true"> ▶</span></button></div>
  </section>{{DOCK_CLOSE}}
  <p class="stephint" id="stepHint" hidden data-i18n="stepHint">Step by step: press → or Space, or tap the dancers, for the next count.</p>
  <section class="nowbox" aria-label="This count">
    <p><b class="lead" data-i18n="leader">Leader</b><span id="nowLeader">{{NOW_L}}</span><small id="wLeader">{{W_L}}</small></p>
    <p><b class="foll" data-i18n="follower">Follower</b><span id="nowFollower">{{NOW_F}}</span><small id="wFollower">{{W_F}}</small></p>
  </section>
  <p id="live" class="sr" aria-live="polite"></p>
  <section class="board" tabindex="0" aria-label="Step table / Tabla de pasos"><table id="steps">{{TABLE}}</table></section>
