<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 770" width="1240" height="770" role="img" aria-labelledby="t d">
<title id="t">Morales network link graph: now and after the handoffs</title>
<desc id="d">Left: links that exist in each site's source at its deployed commit. talkestimate.com links to none of the other sites; mysalsacoach.com and faroquant.com link to carlosmoralesjr.com only from article bylines; moraleslabs.com as deployed has no link to carlosmoralesjr.com (committed in c1f7a7d, not deployed). Right: after the handoffs, every site carries the same network bar, product sites credit Carlos Morales Jr. and carry the Morales Labs endorsement, and Carlos adds his site to Substack, LinkedIn and GitHub.</desc>
<style>
svg{--bg:#FAF6F0;--panel:#FFFFFF;--ink:#14181D;--ink2:#3F4650;--muted:#67615A;--line:#DDD2C2;
--now:#3F4650;--add:#AC3A14;--src:#8A5A00;--paste:#67615A;--hub:#F3EDE3}
@media (prefers-color-scheme:dark){svg{--bg:#12161B;--panel:#1C232B;--ink:#F2EEE8;--ink2:#C9C3B9;--muted:#A69F93;--line:#2C343E;
--now:#C9C3B9;--add:#FF8F6B;--src:#E0B45C;--paste:#A69F93;--hub:#232B34}}
text{font-family:Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line)}
.t{font-size:19px;font-weight:700}.st{font-size:13px;fill:var(--muted)}
.nb{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.hubn{fill:var(--hub);stroke:var(--ink);stroke-width:2}
.nl{font-size:14px;font-weight:600}.ns{font-size:11.5px;fill:var(--muted)}
.e{fill:none;stroke-width:2}.now{stroke:var(--now)}.add{stroke:var(--add);stroke-dasharray:7 5}
.src{stroke:var(--src);stroke-dasharray:3 4;stroke-width:2.4}.paste{stroke:var(--paste);stroke-dasharray:1.5 4.5;stroke-linecap:round}
.el{font-size:11.5px;fill:var(--ink2)}.ela{font-size:11.5px;fill:var(--add);font-weight:600}.els{font-size:11.5px;fill:var(--src);font-weight:600}
.mk-now{fill:var(--now)}.mk-add{fill:var(--add)}.mk-src{fill:var(--src)}.mk-paste{fill:var(--paste)}
.lg{font-size:12.5px;fill:var(--ink2)}
.zero{font-size:11.5px;fill:var(--add);font-weight:600}
</style>
